<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原型：官方素材角色卡</title>
  <style>
    :root {
      color: #f7f8ff;
      background: #070c1b;
      font-family: "Microsoft YaHei UI", "Noto Sans SC", system-ui, sans-serif;
      font-synthesis: none;
      --role-bright: #72e5ff;
      --role-bright-deep: #2cb8e8;
      --role-ink: #061524;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: radial-gradient(circle at 12% 0%, #284775 0, transparent 28rem), radial-gradient(circle at 90% 100%, #3e194c 0, transparent 30rem), #070c1b; }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 96px; }
    .eyebrow { margin: 0 0 10px; color: #aebce4; font-size: 11px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.05; letter-spacing: -.045em; }
    .intro { max-width: 610px; margin: 16px 0 34px; color: #c3cae1; font-size: 15px; line-height: 1.75; }
    .collection-case { position: relative; overflow: hidden; padding: 28px; border: 1px solid rgb(199 217 255 / 20%); border-radius: 28px; background: linear-gradient(135deg, rgb(26 37 67 / 94%), rgb(10 16 36 / 92%)); box-shadow: 0 28px 70px rgb(0 0 0 / 32%); }
    .collection-case::before { position: absolute; inset: 0; content: ""; pointer-events: none; background: linear-gradient(125deg, rgb(255 255 255 / 9%), transparent 28%), repeating-linear-gradient(90deg, transparent 0 46px, rgb(255 255 255 / 2%) 46px 47px); }
    .case-heading { position: relative; display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .case-heading h2 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    .case-heading p { margin: 0; color: #aeb8d4; font-size: 13px; }
    .cards { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .character-card { min-width: 0; display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 20px; padding: 21px 20px 20px; border: 1px solid rgb(212 223 255 / 19%); border-radius: 18px; background: rgb(7 13 30 / 69%); box-shadow: inset 0 1px rgb(255 255 255 / 7%); }
    .portrait-block { position: relative; min-height: 176px; }
    .portrait-shell { position: relative; width: 144px; height: 144px; }
    .avatar { position: absolute; inset: 10px; overflow: hidden; background: #192442; }
    .avatar::after { position: absolute; inset: 0; content: ""; background: linear-gradient(145deg, rgb(255 255 255 / 16%), transparent 35%, rgb(4 7 17 / 44%)); }
    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .official-frame { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
    .role-badge { position: absolute; z-index: 2; left: 10px; bottom: 0; display: inline-flex; align-items: center; gap: 5px; min-height: 27px; padding: 3px 5px; }
    .role-badge .role-icon { width: 22px; height: 22px; }
    .role-badge .role-wordmark { width: auto; height: 20px; }
    .role-badge.sidekick { left: 50%; transform: translateX(-50%); }
    .role-badge.sidekick .role-wordmark { height: 17px; }
    .copy { min-width: 0; padding-top: 5px; }
    .name-line { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .name-copy { min-width: 0; }
    h3 { margin: 0; font-size: 25px; line-height: 1.08; letter-spacing: -.05em; }
    .jp-name { margin: 6px 0 0; color: #aeb9d5; font-size: 13px; }
    .attribute-stack { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 84px; }
    .element { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 0 1px rgb(255 255 255 / 15%), 0 7px 14px rgb(0 0 0 / 20%); }
    .element img { display: block; width: 100%; height: 100%; }
    .role-pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: 84px; }
    .role-pill { display: inline-flex; align-items: center; min-height: 26px; padding: 5px 9px; border: 1px solid rgb(173 246 255 / 68%); border-radius: 8px; color: var(--role-ink); background: linear-gradient(135deg, #b9f7ff, var(--role-bright-deep)); box-shadow: 0 5px 14px rgb(25 202 239 / 22%), inset 0 1px rgb(255 255 255 / 62%); font-size: 12px; font-weight: 900; line-height: 1.1; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .tags span { min-height: 26px; padding: 5px 8px; border: 1px solid rgb(189 207 255 / 19%); border-radius: 7px; color: #dce7ff; background: rgb(71 96 149 / 17%); font-size: 12px; line-height: 1.2; }
    .source-note { position: relative; margin: 21px 0 0; color: #a4b1d2; font-size: 12px; line-height: 1.6; }
    .source-note b { color: #e8efff; }
    @media (max-width: 760px) { main { width: min(100% - 24px, 560px); padding-top: 32px; } .collection-case { padding: 20px; border-radius: 22px; } .case-heading { display: block; } .case-heading p { margin-top: 7px; } .cards { grid-template-columns: 1fr; } }
    @media (max-width: 420px) { .character-card { grid-template-columns: 122px minmax(0, 1fr); gap: 14px; padding: 16px 14px; } .portrait-block { min-height: 151px; } .portrait-shell { width: 119px; height: 119px; } .avatar { inset: 8px; } h3 { font-size: 22px; white-space: nowrap; } .tags { margin-top: 12px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Prototype · official in-game assets</p>
    <h1>官方素材角色卡案例</h1>
    <p class="intro">卡框直接承担稀有度信息；属性与角色身份沿用游戏原图，姓名和技能标签保持速查优先级。</p>

    <section class="collection-case" aria-labelledby="card-example-title">
      <header class="case-heading">
        <h2 id="card-example-title">收藏档案 · Hero 职能高亮</h2>
        <p>Hero：属性＋职能 · Sidekick：普通标签</p>
      </header>
      <div class="cards">
        <article class="character-card">
          <div class="portrait-block">
            <div class="portrait-shell">
              <div class="avatar"><img src="../data/images/icon/akashi.png" alt="赤司头像"></div>
              <img class="official-frame" src="../data/cache/official-ui-candidates/selected/hero-frame-03.png" alt="五星 Hero 金色边框">
            </div>
            <span class="role-badge"><img class="role-icon" src="../data/cache/official-ui-candidates/selected/role-hero.png" alt=""><img class="role-wordmark" src="../data/cache/official-ui-candidates/selected/role-hero-wordmark.png" alt="HERO"></span>
          </div>
          <div class="copy">
            <div class="name-line"><div class="name-copy"><h3>赤司</h3><p class="jp-name">アカシ</p></div><div class="attribute-stack"><span class="element"><img src="../data/cache/official-ui-candidates/selected/element-fire.png" alt="火属性"></span><div class="role-pills" aria-label="职能"><span class="role-pill">攻击</span></div></div></div>
            <div class="tags"><span>敌方单体</span><span>附加炸裂</span><span>武装联动</span></div>
          </div>
        </article>

        <article class="character-card">
          <div class="portrait-block">
            <div class="portrait-shell">
              <div class="avatar"><img src="../data/images/icon/mokdai.png" alt="默大头像"></div>
              <img class="official-frame" src="../data/cache/official-ui-candidates/selected/hero-frame-01.png" alt="三星 Sidekick 铜色方形边框">
            </div>
            <span class="role-badge sidekick"><img class="role-icon" src="../data/cache/official-ui-candidates/selected/role-sidekick.png" alt=""><img class="role-wordmark" src="../data/cache/official-ui-candidates/selected/role-sidekick-wordmark.png" alt="SIDEKICK"></span>
          </div>
          <div class="copy">
            <div class="name-line"><div class="name-copy"><h3>默大</h3><p class="jp-name">モクダイ</p></div></div>
            <div class="tags"><span>辅助</span><span>View 获得</span><span>友方全体</span><span>持续效果</span></div>
          </div>
        </article>
      </div>
      <p class="source-note"><b>当前规则：</b>高亮胶囊本身代表 Hero 职能；Sidekick 不展示属性与职能。</p>
    </section>
  </main>
</body>
</html>
